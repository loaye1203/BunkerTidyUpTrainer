name: Build and publish v1.0.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bunker-tidy-up-trainer-v1.0.0-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Build binaries and release packages
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -UnityVersion 6000.0.59

      - name: Create release if it does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; refusing to replace or upload over it."
            exit 0
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE '.artifacts\release\v1.0.0'
          $assets = @(
            (Join-Path $releaseDir 'BunkerTidyUpTrainer-1.0.0-Setup.exe'),
            (Join-Path $releaseDir 'BunkerTidyUpTrainer-1.0.0-Portable.zip'),
            (Join-Path $releaseDir 'SHA256SUMS.txt'),
            (Join-Path $releaseDir 'release-metadata.json')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title 'Bunker Tidy Up Trainer 1.0.0' --notes-file (Join-Path $env:GITHUB_WORKSPACE 'docs\release-notes-1.0.0.md')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
